name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Development image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built for each run, with layers cached between runs, and passed to the
      # other jobs as an artifact. Hosting the image is planned; see
      # doc/planning.md.
      - name: Build development image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: zule-dev:ci
          outputs: type=docker,dest=${{ runner.temp }}/zule-dev.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload development image
        uses: actions/upload-artifact@v4
        with:
          name: zule-dev-image
          path: ${{ runner.temp }}/zule-dev.tar
          retention-days: 1

  tests-and-format:
    name: Tests and formatting
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download development image
        uses: actions/download-artifact@v4
        with:
          name: zule-dev-image
          path: ${{ runner.temp }}

      # Later steps run in the image through $IN_IMAGE, as the runner's user so
      # files in the workspace are not owned by root.
      - name: Load development image
        run: |
          docker load --input "${{ runner.temp }}/zule-dev.tar"
          echo "IN_IMAGE=docker run --rm --user $(id -u):$(id -g) --env HOME=/tmp --volume $PWD:/work --workdir /work zule-dev:ci" >> "$GITHUB_ENV"

      - name: Check handwritten C formatting
        run: $IN_IMAGE python tools/format.py --check

      # The examples are the reference schedules, so they keep the layout the
      # schedule tool writes; see its README. Test schedules are not held to it.
      - name: Check example schedule formatting
        run: >-
          $IN_IMAGE sh -c 'cd zule/tools/schedule &&
          python -m zule_schedule format --check ../../../examples/*/config/schedule.json'

      - name: Run Python unit tests
        run: $IN_IMAGE sh -c 'cd zule/tools/schedule && python -m unittest discover -s tests -v'

      - name: Build Zule and C tests
        run: $IN_IMAGE sh -c 'cd zule && cmake --preset tests && cmake --build --preset tests'

      - name: Run C unit tests
        run: $IN_IMAGE sh -c 'cd zule && ctest --preset tests'

      - name: Build examples for POSIX
        run: >-
          $IN_IMAGE sh -c 'set -e;
          for example in minimal showcase modes; do
          cd "examples/$example";
          cmake --preset posix;
          cmake --build --preset posix;
          cd ../..;
          done'

      - name: Check generated C formatting
        run: >-
          $IN_IMAGE python tools/format.py --check
          build/examples/minimal/posix/zule_minimal_schedule/zule_schedule_definition.c
          build/examples/minimal/posix/zule_minimal_schedule/zule_task_ids.h
          build/examples/minimal/posix/zule_minimal_schedule/zule_schedule_ids.h
          build/examples/showcase/posix/zule_showcase_schedule/zule_schedule_definition.c
          build/examples/showcase/posix/zule_showcase_schedule/zule_task_ids.h
          build/examples/showcase/posix/zule_showcase_schedule/zule_schedule_ids.h
          build/examples/modes/posix/zule_modes_schedule/zule_schedule_definition.c
          build/examples/modes/posix/zule_modes_schedule/zule_task_ids.h
          build/examples/modes/posix/zule_modes_schedule/zule_schedule_ids.h

      # Each example must print the expected lines, first appearing in the given
      # order: the showcase every task's name, and the modes example its way
      # through the three schedules. The minimal and showcase examples return
      # only on a fault, so they must keep running; the modes example stops
      # itself, so it must exit 0 of its own accord. The minimal example has no
      # timing-sensitive checks, so it is the stable smoke test. The script is
      # passed with -c, since the container has no terminal input.
      - name: Run examples on POSIX
        run: |
          $IN_IMAGE python -c '
          import subprocess
          def run(example, expected, stops=False):
              process = subprocess.Popen(
                  [f"./build/examples/{example}/posix/zule_{example}"],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              try:
                  output, errors = process.communicate(timeout=10 if stops else 2)
              except subprocess.TimeoutExpired:
                  process.terminate()
                  output, errors = process.communicate(timeout=5)
                  if stops:
                      raise SystemExit(f"{example} did not stop by itself\n{output}\n{errors}")
              else:
                  if not stops:
                      raise SystemExit(f"{example} exited unexpectedly: {process.returncode}\n{output}\n{errors}")
                  if process.returncode != 0:
                      raise SystemExit(f"{example} exited {process.returncode}\n{output}\n{errors}")
              print(output, end="")
              lines = output.splitlines()
              if errors or not all(line in lines for line in expected):
                  raise SystemExit(f"{example} check failed: {errors}")
              firsts = [lines.index(line) for line in expected]
              if firsts != sorted(firsts):
                  raise SystemExit(f"{example} printed the expected lines out of order")
          run("minimal", ())
          run("showcase", ("sense", "control", "output"))
          run("modes", (
              "mode_manager: startup complete, switching to operational",
              "sense",
              "control",
              "mode_manager: work done, switching to shutdown",
              "safe_state: outputs safe, stopping the scheduler",
              "Zule modes: the scheduler stopped as requested",
          ), stops=True)
          '

  static:
    name: Static checks
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download development image
        uses: actions/download-artifact@v4
        with:
          name: zule-dev-image
          path: ${{ runner.temp }}

      - name: Load development image
        run: docker load --input "${{ runner.temp }}/zule-dev.tar"

      # Run as the runner's user, so build output in the workspace is not owned by
      # root.
      - name: Build and analyse for target cores
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp
          --volume "$PWD:/work" --workdir /work/zule/tests/static zule-dev:ci
          sh -c 'set -e;
          for preset in stub-m3 stub-m3-all stub-m0plus stub-m0plus-all
          cortex-m-m3 cortex-m-m3-all cortex-m-m0plus cortex-m-m0plus-all; do
          cmake --preset "$preset";
          cmake --build --preset "$preset";
          done'

  target:
    name: Target tests
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download development image
        uses: actions/download-artifact@v4
        with:
          name: zule-dev-image
          path: ${{ runner.temp }}

      - name: Load development image
        run: docker load --input "${{ runner.temp }}/zule-dev.tar"

      # Run as the runner's user, so build output in the workspace is not owned by
      # root.
      - name: Run Cortex-M port tests in QEMU
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp
          --volume "$PWD:/work" --workdir /work/zule/ports/cortex_m/tests/qemu zule-dev:ci
          sh -c 'set -e;
          for preset in qemu-mps2-an385 qemu-mps2-an385-all; do
          cmake --preset "$preset";
          cmake --build --preset "$preset";
          ctest --preset "$preset";
          done'

      - name: Run the core tests in QEMU
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp
          --volume "$PWD:/work" --workdir /work/zule/core/tests/qemu zule-dev:ci
          sh -c 'set -e;
          cmake --preset qemu-mps2-an385;
          cmake --build --preset qemu-mps2-an385;
          ctest --preset qemu-mps2-an385'

      # The minimal example returns only on a fault, so it must still be running
      # after two seconds. It prints nothing, so QEMU's exception log shows it is
      # ticking: SysTick is exception 15, due every 10 ms slot.
      - name: Run the minimal example in QEMU
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp
          --volume "$PWD:/work" --workdir /work/examples/minimal zule-dev:ci
          sh -c 'set -e;
          cmake --preset qemu-mps2-an385;
          cmake --build --preset qemu-mps2-an385;
          status=0;
          timeout 2 qemu-system-arm -machine mps2-an385 -nographic -monitor none
          -semihosting-config enable=on,target=native -icount shift=0,sleep=off
          -d int -D /tmp/qemu.log
          -kernel ../../build/examples/minimal/qemu-mps2-an385/zule_minimal || status=$?;
          ticks=$(grep -c "exception 15" /tmp/qemu.log || true);
          echo "Exit status $status after 2 s, with $ticks ticks";
          test "$status" -eq 124;
          test "$ticks" -ge 50'

      # The showcase must still be running after two seconds, print every task's
      # name, and report its timing; both QEMU's output streams are captured, so
      # the log also shows any error report. In QEMU, with -icount and
      # sleep=off, every tick is exactly on time, so its tick timing reports no
      # deviation.
      - name: Run the showcase in QEMU
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp
          --volume "$PWD:/work" --workdir /work/examples/showcase zule-dev:ci
          sh -c 'set -e;
          cmake --preset qemu-mps2-an385;
          cmake --build --preset qemu-mps2-an385;
          status=0;
          timeout 2 qemu-system-arm -machine mps2-an385 -nographic -monitor none
          -semihosting-config enable=on,target=native -icount shift=0,sleep=off
          -kernel ../../build/examples/showcase/qemu-mps2-an385/zule_showcase
          > /tmp/showcase.log 2>&1 || status=$?;
          grep -v -x -e sense -e control -e output /tmp/showcase.log | head -n 6;
          echo "Exit status $status after 2 s";
          test "$status" -eq 124;
          for task in sense control output; do grep -q -x "$task" /tmp/showcase.log; done;
          grep -q "^Tick timing: worst late 0 us, worst early 0 us" /tmp/showcase.log'


  sanitize:
    name: Tests under sanitizers
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download development image
        uses: actions/download-artifact@v4
        with:
          name: zule-dev-image
          path: ${{ runner.temp }}

      - name: Load development image
        run: docker load --input "${{ runner.temp }}/zule-dev.tar"

      # Run as the runner's user, so build output in the workspace is not owned by
      # root.
      - name: Build and run C unit tests under UBSan and ASan
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp
          --volume "$PWD:/work" --workdir /work/zule zule-dev:ci
          sh -c 'set -e;
          cmake --preset sanitize;
          cmake --build --preset sanitize;
          ctest --preset sanitize'

      # The modes example stops itself, so QEMU must exit 0 of its own accord,
      # within the timeout that is there only to catch a hang. It must switch
      # from the startup schedule, which has no window for sense, before sense
      # first runs, and reach the safe state task after that.
      - name: Run the modes example in QEMU
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp
          --volume "$PWD:/work" --workdir /work/examples/modes zule-dev:ci
          sh -c 'set -e;
          cmake --preset qemu-mps2-an385;
          cmake --build --preset qemu-mps2-an385;
          status=0;
          timeout 20 qemu-system-arm -machine mps2-an385 -nographic -monitor none
          -semihosting-config enable=on,target=native -icount shift=0,sleep=off
          -kernel ../../build/examples/modes/qemu-mps2-an385/zule_modes
          > /tmp/modes.log 2>&1 || status=$?;
          grep -v -x -e sense -e control /tmp/modes.log | head -n 6;
          echo "Exit status $status";
          test "$status" -eq 0;
          switch=$(grep -n -m 1 -x "mode_manager: startup complete, switching to operational" /tmp/modes.log | cut -d : -f 1);
          sense=$(grep -n -m 1 -x sense /tmp/modes.log | cut -d : -f 1);
          safe=$(grep -n -m 1 -x "safe_state: outputs safe, stopping the scheduler" /tmp/modes.log | cut -d : -f 1);
          test -n "$switch" && test -n "$sense" && test -n "$safe";
          test "$switch" -lt "$sense" && test "$sense" -lt "$safe";
          grep -q -x "Zule modes: the scheduler stopped as requested" /tmp/modes.log'
