name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-format:
    name: Tests and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            zule/tools/schedule/requirements.txt

      - name: Install pinned development tools
        run: |
          python -m pip install -r requirements-dev.txt
          cmake --version

      - name: Check handwritten C formatting
        run: python tools/format.py --check

      - name: Run Python unit tests
        working-directory: zule/tools/schedule
        run: python -m unittest discover -s tests -v

      - name: Configure Zule and C tests
        working-directory: zule
        run: cmake --preset host

      - name: Build Zule and C tests
        working-directory: zule
        run: cmake --build --preset host

      - name: Run C unit tests
        working-directory: zule
        run: ctest --preset host

      - name: Configure demo
        working-directory: demo
        run: >-
          cmake --preset host
          -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}"

      - name: Build demo
        working-directory: demo
        run: cmake --build --preset host

      - name: Check generated C formatting
        run: >-
          python tools/format.py --check
          build/demo-host/zule_demo_schedule/zule_schedule_definition.c
          build/demo-host/zule_demo_schedule/zule_task_ids.h

      - name: Run demo
        run: |
          python - <<'PY'
          import subprocess
          process = subprocess.Popen(
              ["./build/demo-host/zule_demo"], stdout=subprocess.PIPE,
              stderr=subprocess.PIPE, text=True,
          )
          try:
              output, errors = process.communicate(timeout=2)
          except subprocess.TimeoutExpired:
              process.terminate()
              output, errors = process.communicate(timeout=5)
          else:
              raise SystemExit(f"Demo exited unexpectedly: {process.returncode}\n{output}\n{errors}")
          print(output, end="")
          if errors or not all(task in output.splitlines() for task in ("sense", "control", "output")):
              raise SystemExit(f"Demo smoke test failed: {errors}")
          PY

  cross:
    name: Cross-compiled builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built for each run, with layers cached between runs. Hosting the image is
      # planned; see doc/planning.md.
      - name: Build development image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: zule-dev:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run as the runner's user, so build output in the workspace is not owned by
      # root.
      - name: Build Cortex-M link checks
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --volume "$PWD:/work" --workdir /work/zule zule-dev:ci
          sh -c 'set -e;
          for preset in cross-m3 cross-m3-all cross-m0plus cross-m0plus-all; do
          cmake --preset "$preset";
          cmake --build --preset "$preset";
          done'
