name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-format:
    name: Tests and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            zule/tools/schedule/requirements.txt

      - name: Install Python dependencies and formatter
        run: python -m pip install -r requirements-dev.txt

      - name: Check handwritten C formatting
        run: python tools/format.py --check

      - name: Run Python unit tests
        working-directory: zule/tools/schedule
        run: python -m unittest discover -s tests -v

      - name: Configure Zule and C tests
        run: >-
          cmake -S zule -B build/zule
          -DCMAKE_BUILD_TYPE=Release
          -DZULE_PORT=posix

      - name: Build Zule and C tests
        run: cmake --build build/zule --parallel

      - name: Run C unit tests
        run: ctest --test-dir build/zule --output-on-failure --no-tests=error

      - name: Configure demo
        run: >-
          cmake -S demo -B build/demo
          -DCMAKE_BUILD_TYPE=Release
          -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}"

      - name: Build demo
        run: cmake --build build/demo --parallel

      - name: Check generated C formatting
        run: >-
          python tools/format.py --check
          build/demo/zule_demo_schedule/zule_schedule_definition.c
          build/demo/zule_demo_schedule/zule_task_ids.h

      - name: Run demo
        run: |
          python - <<'PY'
          import subprocess
          process = subprocess.Popen(
              ["./build/demo/zule_demo"], stdout=subprocess.PIPE,
              stderr=subprocess.PIPE, text=True,
          )
          try:
              output, errors = process.communicate(timeout=2)
          except subprocess.TimeoutExpired:
              process.terminate()
              output, errors = process.communicate(timeout=5)
          else:
              raise SystemExit(f"Demo exited unexpectedly: {process.returncode}\n{output}\n{errors}")
          print(output, end="")
          if errors or not all(task in output.splitlines() for task in ("sense", "control", "output")):
              raise SystemExit(f"Demo smoke test failed: {errors}")
          PY
