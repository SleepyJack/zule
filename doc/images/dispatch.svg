<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="444" viewBox="0 0 1120 444" role="img" aria-labelledby="title description">
  <title id="title">Task dispatch</title>
  <desc id="description">A tick at the window start publishes pending work. After tick processing, the application loop claims the task under exclusion, marks it running, and calls the task function outside the critical section.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
    </style>
  </defs>
  <rect width="1120" height="444" rx="12" fill="#ffffff"/>
  <text x="32" y="34" font-size="22" fill="#475569" text-anchor="start" font-weight="700">Task dispatch</text>
  <text x="32" y="62" font-size="14" fill="#475569" text-anchor="start" font-weight="400">Expanded view of one release boundary; application execution pauses during the ISR.</text>
  <line x1="180" y1="104" x2="1080" y2="104" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="32" y="109" font-size="14" fill="#475569" text-anchor="start" font-weight="400">Time</text>
  <text x="32" y="158" font-size="15" fill="#475569" text-anchor="start" font-weight="400">Tick</text>
  <text x="32" y="176" font-size="13" fill="#475569" text-anchor="start" font-weight="400">context</text>
  <line x1="180" y1="163" x2="1080" y2="163" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="254" font-size="15" fill="#475569" text-anchor="start" font-weight="400">Application</text>
  <text x="32" y="272" font-size="13" fill="#475569" text-anchor="start" font-weight="400">context</text>
  <line x1="180" y1="259" x2="1080" y2="259" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="346" font-size="15" fill="#475569" text-anchor="start" font-weight="400">Execution</text>
  <text x="32" y="364" font-size="13" fill="#475569" text-anchor="start" font-weight="400">state</text>
  <line x1="180" y1="351" x2="1080" y2="351" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="300" y1="112" x2="300" y2="382" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/>
  <line x1="380" y1="112" x2="380" y2="382" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/>
  <line x1="430" y1="112" x2="430" y2="382" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/>
  <line x1="510" y1="112" x2="510" y2="382" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="300" y="88" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">Window start</text>
  <rect x="300" y="144" width="130" height="38" fill="#ffedd5" stroke="#fdba74"/>
  <text x="365.0" y="168.0" font-size="14" fill="#7c2d12" text-anchor="middle" font-weight="400">Release tick</text>
  <rect x="180" y="240" width="120" height="38" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="240.0" y="264.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">Poll</text>
  <rect x="430" y="240" width="80" height="38" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="470.0" y="264.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">Poll</text>
  <rect x="510" y="240" width="570" height="38" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="795.0" y="264.0" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="400">Claim → dispatch → task function</text>
  <text x="380" y="318" font-size="13" fill="#475569" text-anchor="middle" font-weight="400">Released</text>
  <text x="510" y="318" font-size="13" fill="#475569" text-anchor="middle" font-weight="400">Claimed</text>
  <rect x="180" y="332" width="200" height="38" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="280.0" y="356.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">Idle</text>
  <rect x="380" y="332" width="130" height="38" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="445.0" y="356.0" font-size="14" fill="#78350f" text-anchor="middle" font-weight="400">Pending</text>
  <rect x="510" y="332" width="570" height="38" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="795.0" y="356.0" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="400">Running</text>
  <text x="32" y="413" font-size="14" fill="#475569" text-anchor="start" font-weight="400">Running begins when the task is claimed, before the function call. Expanded view; not to scale.</text>
</svg>
