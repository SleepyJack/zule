<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title description">
  <title id="title">Example schedule · 10-slot cycle</title>
  <desc id="description">Task 1 has window [0,4) and Task 2 has window [5,10). Both complete early and remain completed until their deadlines. Slot 4 is idle. The first two slots of the next cycle are also shown.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
    </style>
  </defs>
  <rect width="1120" height="450" rx="12" fill="#ffffff"/>
  <text x="32" y="34" font-size="22" fill="#475569" text-anchor="start" font-weight="700">Example schedule · 10-slot cycle</text>
  <text x="32" y="58" font-size="14" fill="#475569" text-anchor="start" font-weight="400">Reserved windows and execution state across a cycle boundary.</text>
  <line x1="180" y1="92" x2="180" y2="82" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="180" y1="82" x2="900" y2="82" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="900" y1="82" x2="900" y2="92" stroke="#cbd5e1" stroke-width="1"/>
  <text x="540.0" y="75" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">Cycle 0 · 10 slots</text>
  <line x1="900" y1="92" x2="900" y2="82" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="900" y1="82" x2="1044" y2="82" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="1044" y1="82" x2="1044" y2="92" stroke="#cbd5e1" stroke-width="1"/>
  <text x="972.0" y="75" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">Cycle 1</text>
  <text x="32" y="135" font-size="15" fill="#475569" text-anchor="start" font-weight="400">Slot</text>
  <line x1="180" y1="145" x2="180" y2="370" stroke="#e2e8f0" stroke-width="1"/>
  <text x="216" y="135" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">0</text>
  <line x1="252" y1="145" x2="252" y2="370" stroke="#e2e8f0" stroke-width="1"/>
  <text x="288" y="135" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">1</text>
  <line x1="324" y1="145" x2="324" y2="370" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="135" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">2</text>
  <line x1="396" y1="145" x2="396" y2="370" stroke="#e2e8f0" stroke-width="1"/>
  <text x="432" y="135" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">3</text>
