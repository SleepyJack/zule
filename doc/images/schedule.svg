  <line x1="972" y1="292" x2="972" y2="266" stroke="#c2410c" stroke-width="2"/>
  <line x1="1044" y1="292" x2="1044" y2="266" stroke="#c2410c" stroke-width="2"/>
  <text x="32" y="335" font-size="15" fill="#475569" text-anchor="start" font-weight="400">Execution</text>
  <text x="32" y="353" font-size="13" fill="#475569" text-anchor="start" font-weight="400">state</text>
  <rect x="180" y="320" width="162" height="38" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="261.0" y="344.0" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="400">Running</text>
  <rect x="342" y="320" width="126" height="38" fill="#dcfce7" stroke="#86efac"/>
  <text x="405.0" y="344.0" font-size="14" fill="#166534" text-anchor="middle" font-weight="400">Completed</text>
  <rect x="468" y="320" width="72" height="38" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="504.0" y="344.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">Idle</text>
  <rect x="540" y="320" width="252" height="38" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="666.0" y="344.0" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="400">Running</text>
  <rect x="792" y="320" width="108" height="38" fill="#dcfce7" stroke="#86efac"/>
  <text x="846.0" y="344.0" font-size="14" fill="#166534" text-anchor="middle" font-weight="400">Completed</text>
  <rect x="900" y="320" width="144" height="38" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="972.0" y="344.0" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="400">Running</text>
  <line x1="180" y1="390" x2="1080" y2="390" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="32" y="395" font-size="14" fill="#475569" text-anchor="start" font-weight="400">Time</text>
  <text x="32" y="426" font-size="14" fill="#475569" text-anchor="start" font-weight="400">Pending intervals and tick execution time are omitted at this scale.</text>
