<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="444" viewBox="0 0 1120 444" role="img" aria-labelledby="title description">
  <title id="title">Scheduler initialisation</title>
  <desc id="description">The timer is enabled before timer initialization returns. Its first tick publishes a pending task at slot zero. Application context finishes timer setup and then claims and dispatches the task.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
    </style>
  </defs>
  <rect width="1120" height="444" rx="12" fill="#ffffff"/>
  <text x="32" y="34" font-size="22" fill="#475569" text-anchor="start" font-weight="700">Scheduler initialisation</text>
  <text x="32" y="62" font-size="14" fill="#475569" text-anchor="start" font-weight="400">Example: the first tick arrives while the port timer-start call is still in progress.</text>
  <line x1="180" y1="104" x2="1080" y2="104" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="32" y="109" font-size="14" fill="#475569" text-anchor="start" font-weight="400">Time</text>
  <text x="32" y="158" font-size="15" fill="#475569" text-anchor="start" font-weight="400">Tick</text>
  <text x="32" y="176" font-size="13" fill="#475569" text-anchor="start" font-weight="400">context</text>
  <line x1="180" y1="163" x2="1080" y2="163" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="254" font-size="15" fill="#475569" text-anchor="start" font-weight="400">Application</text>
  <text x="32" y="272" font-size="13" fill="#475569" text-anchor="start" font-weight="400">context</text>
  <line x1="180" y1="259" x2="1080" y2="259" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="346" font-size="15" fill="#475569" text-anchor="start" font-weight="400">Execution</text>
  <text x="32" y="364" font-size="13" fill="#475569" text-anchor="start" font-weight="400">state</text>
  <line x1="180" y1="351" x2="1080" y2="351" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="320" y1="112" x2="320" y2="382" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/>
  <line x1="460" y1="112" x2="460" y2="382" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/>
  <line x1="520" y1="112" x2="520" y2="382" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/>
  <line x1="580" y1="112" x2="580" y2="382" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/>
  <line x1="740" y1="112" x2="740" y2="382" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/>
  <line x1="840" y1="112" x2="840" y2="382" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="320" y="88" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">Timer enabled</text>
  <text x="740" y="88" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">Timer init returns</text>
  <rect x="460" y="144" width="120" height="38" fill="#ffedd5" stroke="#fdba74"/>
  <text x="520.0" y="168.0" font-size="14" fill="#7c2d12" text-anchor="middle" font-weight="400">Tick 0</text>
  <rect x="180" y="240" width="280" height="38" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="320.0" y="264.0" font-size="13" fill="#475569" text-anchor="middle" font-weight="400">Initialize scheduler / start timer</text>
  <rect x="580" y="240" width="160" height="38" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="660.0" y="264.0" font-size="13" fill="#475569" text-anchor="middle" font-weight="400">Finish timer init</text>
  <rect x="740" y="240" width="100" height="38" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="790.0" y="264.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">Poll</text>
  <rect x="840" y="240" width="240" height="38" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="960.0" y="264.0" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="400">Dispatch / task function</text>
  <text x="520" y="318" font-size="13" fill="#475569" text-anchor="middle" font-weight="400">Released</text>
  <text x="840" y="318" font-size="13" fill="#475569" text-anchor="middle" font-weight="400">Claimed</text>
  <rect x="180" y="332" width="340" height="38" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="350.0" y="356.0" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">Idle</text>
  <rect x="520" y="332" width="320" height="38" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="680.0" y="356.0" font-size="14" fill="#78350f" text-anchor="middle" font-weight="400">Pending</text>
  <rect x="840" y="332" width="240" height="38" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="960.0" y="356.0" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="400">Running</text>
  <text x="32" y="413" font-size="14" fill="#475569" text-anchor="start" font-weight="400">Startup after the release tick consumes part of the first execution window. Expanded view; not to scale.</text>
</svg>
