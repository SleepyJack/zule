<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-labelledby="title description">
  <title id="title">Zule component architecture</title>
  <desc id="description">The user domain contains configuration and application code. The Zule domain contains the port, core, and modules. Configuration supplies port settings to the port, the schedule and core settings to the core, and per-task storage, generated from the schedule, to the modules. The application controls the scheduler, which calls tasks and user hooks in application context, and fault handlers and user hooks in tick context. The core uses port services and the port delivers ticks to the core. The core sends hook events to the modules, whose results the application reads.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
      .domain { font-size: 19px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 16px; fill: #334155; }
      .label { font-size: 15px; fill: #334155; }
      .context { font-size: 13px; fill: #64748b; }
      .link { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .user { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .zule { fill: #ffffff; stroke: #3b82f6; stroke-width: 1.5; }
      .application-context { fill: #f1f5f9; stroke: #cbd5e1; }
      .tick-context { fill: #fff7ed; stroke: #fed7aa; }
    </style>
  </defs>

  <rect width="1120" height="860" fill="#ffffff"/>
  <rect x="24" y="24" width="380" height="812" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="428" y="24" width="668" height="812" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="48" y="63" class="domain">User domain</text>
  <text x="452" y="63" class="domain">Zule domain</text>

  <!-- User domain -->
  <rect x="56" y="100" width="316" height="150" rx="8" class="user"/>
  <text x="80" y="138" class="heading">Configuration</text>
  <text x="80" y="177" class="body">Task list definition</text>
  <text x="80" y="205" class="body">Schedule definition</text>
  <text x="80" y="233" class="body">Core and port settings</text>

  <rect x="56" y="300" width="316" height="290" rx="8" class="user"/>
  <text x="80" y="335" class="heading">Application</text>
  <rect x="72" y="350" width="284" height="120" rx="8" class="application-context"/>
  <text x="88" y="375" class="context">Application context</text>
  <text x="88" y="407" class="body">Scheduler invocation</text>
  <text x="88" y="434" class="body">Task implementations</text>
  <text x="88" y="461" class="body">User hooks</text>
  <rect x="72" y="482" width="284" height="96" rx="8" class="tick-context"/>
  <text x="88" y="506" class="context">Tick context</text>
  <text x="88" y="536" class="body">Fault handling</text>
  <text x="88" y="562" class="body">User hooks</text>

  <!-- Zule domain: port, core, and modules, in the same style -->
  <rect x="720" y="100" width="344" height="150" rx="8" class="zule"/>
  <text x="744" y="135" class="heading">Port</text>
  <rect x="736" y="150" width="312" height="84" rx="8" class="tick-context"/>
  <text x="752" y="175" class="context">Tick context</text>
  <text x="752" y="207" class="body">Timer implementation</text>

  <rect x="720" y="300" width="344" height="290" rx="8" class="zule"/>
  <text x="744" y="335" class="heading">Core</text>
  <rect x="736" y="350" width="312" height="90" rx="8" class="application-context"/>
  <text x="752" y="375" class="context">Application context</text>
  <text x="752" y="410" class="body">Task runner</text>
  <rect x="736" y="460" width="312" height="106" rx="8" class="tick-context"/>
  <text x="752" y="485" class="context">Tick context</text>
  <text x="752" y="516" class="body">Schedule timing</text>
  <text x="752" y="543" class="body">Task deadline checks</text>

  <rect x="720" y="650" width="344" height="150" rx="8" class="zule"/>
  <text x="744" y="685" class="heading">Modules</text>
  <text x="744" y="724" class="body">Hook event consumers</text>
  <text x="744" y="752" class="body">Per-task data</text>
  <text x="744" y="780" class="body">Result APIs</text>

  <!-- Configuration to each Zule component -->
  <path d="M 372 175 H 720" class="link"/>
  <text x="546" y="165" class="label" text-anchor="middle">Port settings</text>
  <path d="M 214 250 V 275 H 740 V 300" class="link"/>
  <text x="546" y="268" class="label" text-anchor="middle">Schedule and core settings</text>
  <path d="M 56 225 H 40 V 760 H 720" class="link"/>
  <text x="546" y="750" class="label" text-anchor="middle">Per-task storage</text>

  <!-- Application and core -->
  <path d="M 372 365 H 720" class="link"/>
  <text x="546" y="355" class="label" text-anchor="middle">Start/stop scheduler</text>
  <path d="M 720 425 H 372" class="link"/>
  <text x="546" y="415" class="label" text-anchor="middle">Dispatch task, user hooks</text>
  <path d="M 720 520 H 372" class="link"/>
  <text x="546" y="510" class="label" text-anchor="middle">Notify fault, user hooks</text>

  <!-- Core and port -->
  <path d="M 880 300 V 250" class="link"/>
  <text x="870" y="281" class="label" text-anchor="end">Port services</text>
  <path d="M 1030 250 V 300" class="link"/>
  <text x="1020" y="281" class="label" text-anchor="end">Periodic tick</text>

  <!-- Core and modules, and the application reading module results -->
  <path d="M 890 590 V 650" class="link"/>
  <text x="880" y="625" class="label" text-anchor="end">Hook events</text>
  <path d="M 214 590 V 700 H 720" class="link"/>
  <text x="546" y="690" class="label" text-anchor="middle">Read results</text>
</svg>
